
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add a Cafe</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5" style="max-width: 700px;">

    <h1 class="mb-4">Add a New Cafe</h1>

    <form method="POST" action="{{ url_for('add_cafe') }}">

        <div class="mb-3">
            <label class="form-label">Cafe Name *</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Google Maps URL *</label>
            <input type="url" name="map_url" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Cafe Image URL *</label>
            <input type="url" name="img_url" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Location *</label>
            <input type="text" name="location" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Number of Seats</label>
            <input type="text" name="seats" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Coffee Price</label>
            <input type="text" name="coffee_price" class="form-control">
        </div>

        <div class="form-check mb-2">
            <input type="checkbox" name="has_wifi" class="form-check-input">
            <label class="form-check-label">Wi-Fi available</label>
        </div>

        <div class="form-check mb-2">
            <input type="checkbox" name="has_sockets" class="form-check-input">
            <label class="form-check-label">Power sockets available</label>
        </div>

        <div class="form-check mb-2">
            <input type="checkbox" name="has_toilet" class="form-check-input">
            <label class="form-check-label">Toilet available</label>
        </div>

        <div class="form-check mb-4">
            <input type="checkbox" name="can_take_calls" class="form-check-input">
            <label class="form-check-label">Calls allowed</label>
        </div>

        <button type="submit" class="btn btn-success">
            Save Cafe
        </button>

        <a href="{{ url_for('home') }}" class="btn btn-secondary">
            Back to Home
        </a>

    </form>
</div>

</body>
</html>
